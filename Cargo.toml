[package]
name = "rust-sillytavern"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = ">=4.5, <4.6", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
